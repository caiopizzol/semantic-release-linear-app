name: Promote to Stable

on:
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout stable || git checkout -b stable
          git merge main --no-ff -m "chore: promote main to stable"
          git push origin stable

      # A push made with GITHUB_TOKEN doesn't start other workflows, so start the stable release directly.
      - name: Release stable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release-package.yml --ref stable --repo "$GITHUB_REPOSITORY"
